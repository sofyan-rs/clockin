<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attendance history</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0d6e63}a:hover{color:#0a5249}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f7f6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111816; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 32px 16px 16px; overflow: hidden">
    <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.3px">History</h1>

    <section aria-label="Calendar" style="background: #ffffff; border-radius: 14px; padding: 8px 12px 12px; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button aria-label="Previous month" style="width: 48px; height: 48px; border: 0; background: transparent; color: #111816; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg></button>
        <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">October 2026</h2>
        <button aria-label="Next month" style="width: 48px; height: 48px; border: 0; background: transparent; color: #7d8b87; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 12px; line-height: 16px; font-weight: 600; color: #55625e">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <span aria-label="{{c.label}}" style="{{c.style}}">{{c.day}}</span>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1c7a43"></span>On time</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #9a5200"></span>Late</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2858b8"></span>Leave / Sick</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #b3261e"></span>Absent</span>
      </div>
    </section>

    <section aria-label="Monthly summary" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <div style="background: #ffffff; border-radius: 14px; padding: 10px 8px; text-align: center; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
        <div style="font-size: 18px; line-height: 24px; font-weight: 700; color: #1c7a43; font-variant-numeric: tabular-nums">4</div>
        <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">On time</div>
      </div>
      <div style="background: #ffffff; border-radius: 14px; padding: 10px 8px; text-align: center; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
        <div style="font-size: 18px; line-height: 24px; font-weight: 700; color: #9a5200; font-variant-numeric: tabular-nums">1</div>
        <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">Late</div>
      </div>
      <div style="background: #ffffff; border-radius: 14px; padding: 10px 8px; text-align: center; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
        <div style="font-size: 18px; line-height: 24px; font-weight: 700; color: #2858b8; font-variant-numeric: tabular-nums">1</div>
        <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">Leave</div>
      </div>
      <div style="background: #ffffff; border-radius: 14px; padding: 10px 8px; text-align: center; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
        <div style="font-size: 18px; line-height: 24px; font-weight: 700; color: #b3261e; font-variant-numeric: tabular-nums">0</div>
        <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">Absent</div>
      </div>
    </section>

    <section aria-label="Daily list" style="background: #ffffff; border-radius: 14px; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06); padding: 0 16px">
      <a href="DayDetail.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #d3dcd9; text-decoration: none; color: #111816">
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 600">Thu, 8 Oct · Today</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e; font-variant-numeric: tabular-nums">07:52 – in progress</span>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 4px; background: #e3f4e9; color: #1c7a43; font-size: 13px; line-height: 18px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>On time</span>
      </a>
      <a href="DayDetail.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #d3dcd9; text-decoration: none; color: #111816">
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 600">Wed, 7 Oct</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">Doctor's note attached</span>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 4px; background: #e5edfc; color: #2858b8; font-size: 13px; line-height: 18px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 17h6"/><path d="M9 13h6"/></svg>Sick</span>
      </a>
      <a href="DayDetail.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; text-decoration: none; color: #111816">
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 600">Tue, 6 Oct</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e; font-variant-numeric: tabular-nums">08:12 – 17:20</span>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 4px; background: #fdf0dc; color: #9a5200; font-size: 13px; line-height: 18px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 7v5l3 3"/></svg>Late 12 min</span>
      </a>
    </section>
  </main>

  <nav aria-label="Main navigation" style="height: 72px; flex: 0 0 72px; background: #ffffff; box-shadow: 0 -1px 0 #d3dcd9; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 10px">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #55625e">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8.71l-5.333 -4.148a2.666 2.666 0 0 0 -3.274 0l-5.334 4.148a2.665 2.665 0 0 0 -1.029 2.105v7.2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-7.2c0 -.823 -.38 -1.6 -1.03 -2.105"/><path d="M16 15c-2.21 1.333 -5.792 1.333 -8 0"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Home</span>
    </a>
    <a href="History.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #0d6e63">
      <span style="width: 56px; height: 30px; border-radius: 999px; background: #e6f4f1; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2z"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 700">History</span>
    </a>
    <a href="Requests.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #55625e">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 9l1 0"/><path d="M9 13l6 0"/><path d="M9 17l6 0"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Requests</span>
    </a>
    <a href="Profile.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #55625e">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Profile</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var status = { 1: 'ontime', 2: 'ontime', 5: 'ontime', 6: 'late', 7: 'sick', 8: 'today' };
    var look = {
      ontime: { bg: '#e3f4e9', fg: '#1c7a43', label: 'On time' },
      late: { bg: '#fdf0dc', fg: '#9a5200', label: 'Late' },
      sick: { bg: '#e5edfc', fg: '#2858b8', label: 'Sick' },
      today: { bg: '#e3f4e9', fg: '#1c7a43', label: 'Today, on time' },
      weekend: { bg: 'transparent', fg: '#7d8b87', label: 'Weekend' },
      future: { bg: 'transparent', fg: '#111816', label: 'Upcoming' }
    };
    var base = 'height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;';
    var cells = [];
    for (var b = 0; b < 3; b++) cells.push({ day: '', label: '', style: base });
    for (var d = 1; d <= 31; d++) {
      var col = (d + 2) % 7;
      var key = status[d] || (col === 5 || col === 6 ? 'weekend' : (d < 8 ? 'weekend' : 'future'));
      var l = look[key];
      var extra = key === 'today' ? ' box-shadow: inset 0 0 0 2px #0d6e63;' : '';
      cells.push({ day: String(d), label: d + ' October, ' + l.label, style: base + ' background: ' + l.bg + '; color: ' + l.fg + ';' + extra });
    }
    cells.push({ day: '', label: '', style: base });
    return { cells: cells };
  }
}
</script>
</body>
</html>
