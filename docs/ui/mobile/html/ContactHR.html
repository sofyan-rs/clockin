<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact HR</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0d6e63}a:hover{color:#0a5249}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f7f6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111816; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 24px 16px 8px 4px">
    <a href="Login.html" aria-label="Back to sign in" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #111816">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Contact HR</h1>
  </header>

  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 24px">
    <section aria-label="HR team" style="background: #ffffff; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; line-height: 22px; font-weight: 600">People &amp; HR team</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 7v5l3 3"/></svg>
          Mon–Fri, 08:00–17:00 WIB · replies within 1 work day
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <a href="#" style="min-height: 72px; border-radius: 14px; background: #e6f4f1; color: #0a5249; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1"/></svg>
          Chat
        </a>
        <a href="#" style="min-height: 72px; border-radius: 14px; background: #e6f4f1; color: #0a5249; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/></svg>
          Call
        </a>
        <a href="#" style="min-height: 72px; border-radius: 14px; background: #e6f4f1; color: #0a5249; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z"/><path d="M3 7l9 6l9 -6"/></svg>
          Email
        </a>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"/></svg>
        Sudirman Head Office, [HR office floor/room]
      </span>
    </section>

    <form style="margin: 0; background: #ffffff; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
      <h2 style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600">Or send a request</h2>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 18px; font-weight: 600">What do you need help with?</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <label style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #0d6e63; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer"><input type="radio" name="topic" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>Forgot password</label>
          <label style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #d3dcd9; color: #111816; font-size: 13px; font-weight: 600; cursor: pointer"><input type="radio" name="topic" style="position: absolute; opacity: 0; width: 1px; height: 1px">New phone</label>
          <label style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #d3dcd9; color: #111816; font-size: 13px; font-weight: 600; cursor: pointer"><input type="radio" name="topic" style="position: absolute; opacity: 0; width: 1px; height: 1px">Can't sign in</label>
          <label style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #d3dcd9; color: #111816; font-size: 13px; font-weight: 600; cursor: pointer"><input type="radio" name="topic" style="position: absolute; opacity: 0; width: 1px; height: 1px">Other</label>
        </div>
      </fieldset>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="hr-id" style="font-size: 13px; line-height: 18px; font-weight: 600">Employee ID or email</label>
        <input id="hr-id" type="text" value="rina.saputri@sasana.co" style="height: 48px; border: 1px solid #d3dcd9; border-radius: 8px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #111816; background: #ffffff">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="hr-msg" style="font-size: 13px; line-height: 18px; font-weight: 600">Message <span style="font-weight: 500; color: #55625e">(optional)</span></label>
        <textarea id="hr-msg" rows="3" placeholder="Tell HR anything that helps, e.g. I no longer have access to my work email." style="border: 1px solid #d3dcd9; border-radius: 8px; padding: 12px 14px; font-family: inherit; font-size: 15px; line-height: 22px; color: #111816; resize: none"></textarea>
      </div>
    </form>

    <div style="flex: 1 1 auto"></div>

    <button type="button" style="height: 56px; border-radius: 14px; border: 0; background: #0d6e63; color: #ffffff; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; line-height: 22px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(13,110,99,0.22)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14l11 -11"/><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5"/></svg>
      Send to HR
    </button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
