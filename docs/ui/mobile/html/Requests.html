<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Requests</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0d6e63}a:hover{color:#0a5249}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f7f6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111816; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 32px 16px 16px">
    <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.3px">Requests</h1>

    <section aria-label="Leave balance" style="background: #ffffff; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #55625e">Annual leave 2026</span>
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">Resets 1 Jan</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums">
        <span style="font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.5px">9</span>
        <span style="font-size: 15px; line-height: 22px; color: #55625e">of 12 days left</span>
      </div>
      <div role="progressbar" aria-label="Annual leave used" aria-valuenow="3" aria-valuemin="0" aria-valuemax="12" style="height: 8px; border-radius: 999px; background: #e8edeb; overflow: hidden">
        <div style="width: 25%; height: 100%; background: #2858b8"></div>
      </div>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e">3 used · 2 more waiting for approval</span>
    </section>

    <div role="tablist" aria-label="Request type" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <section aria-label="Your requests" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; background: #ffffff; border-radius: 14px; padding: 0 16px; box-shadow: 0 1px 2px rgba(17,24,22,0.06), 0 4px 12px rgba(17,24,22,0.06)">
      <sc-for list="{{items}}" as="r" hint-placeholder-count="5">
        <a href="{{r.href}}" style="{{r.rowStyle}}">
          <span style="{{r.wellStyle}}">
            <sc-if value="{{r.isLeave}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.553 16.75a7.5 7.5 0 0 0 -10.606 0"/><path d="M18 3.804a6 6 0 0 0 -8.196 2.196l10.392 6a6 6 0 0 0 -2.196 -8.196z"/><path d="M16.732 10c1.658 -2.87 2.225 -5.644 1.268 -6.196c-.957 -.552 -3.075 1.326 -4.732 4.196"/><path d="M15 9l-3 5.196"/><path d="M3 19.25a2.4 2.4 0 0 1 1 -.25a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 1 .25"/></svg></sc-if>
            <sc-if value="{{r.isSick}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2"/><path d="M4 8m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M10 14h4"/><path d="M12 12v4"/></svg></sc-if>
            <sc-if value="{{r.isOvertime}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.984 12.535a9 9 0 1 0 -8.468 8.45"/><path d="M16 19h6"/><path d="M19 16v6"/><path d="M12 7v5l3 3"/></svg></sc-if>
            <sc-if value="{{r.isCorrection}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></svg></sc-if>
          </span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; line-height: 22px; font-weight: 600">{{r.type}}</span>
            <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #55625e; font-variant-numeric: tabular-nums">{{r.detail}}</span>
          </span>
          <span style="{{r.badgeStyle}}">
            <sc-if value="{{r.isPending}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20v-2a6 6 0 1 1 12 0v2a1 1 0 0 1 -1 1h-10a1 1 0 0 1 -1 -1z"/><path d="M6 4v2a6 6 0 1 0 12 0v-2a1 1 0 0 0 -1 -1h-10a1 1 0 0 0 -1 1z"/></svg></sc-if>
            <sc-if value="{{r.isApproved}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg></sc-if>
            <sc-if value="{{r.isDeclined}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></sc-if>
            {{r.status}}
          </span>
        </a>
      </sc-for>
    </section>

    <a href="NewRequest.html" style="flex: 0 0 auto; height: 56px; border-radius: 14px; background: #0d6e63; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; line-height: 22px; font-weight: 700; box-shadow: 0 8px 24px rgba(13,110,99,0.22)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg>
      New request
    </a>
  </main>

  <nav aria-label="Main navigation" style="height: 72px; flex: 0 0 72px; background: #ffffff; box-shadow: 0 -1px 0 #d3dcd9; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 10px">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #55625e">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8.71l-5.333 -4.148a2.666 2.666 0 0 0 -3.274 0l-5.334 4.148a2.665 2.665 0 0 0 -1.029 2.105v7.2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-7.2c0 -.823 -.38 -1.6 -1.03 -2.105"/><path d="M16 15c-2.21 1.333 -5.792 1.333 -8 0"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Home</span>
    </a>
    <a href="History.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #55625e">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M16 3l0 4"/><path d="M8 3l0 4"/><path d="M4 11l16 0"/><path d="M8 15h2v2h-2z"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">History</span>
    </a>
    <a href="Requests.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #0d6e63">
      <span style="width: 56px; height: 30px; border-radius: 999px; background: #e6f4f1; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 9l1 0"/><path d="M9 13l6 0"/><path d="M9 17l6 0"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 700">Requests</span>
    </a>
    <a href="Profile.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #55625e">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500">Profile</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    var self = this;
    var all = [
      { kind: 'leave', type: 'Annual leave', detail: '26–27 Oct · 2 days · sent 8 Oct', status: 'pending' },
      { kind: 'correction', type: 'Attendance correction', detail: 'Tue, 6 Oct · clock in 08:12 → 07:58', status: 'pending' },
      { kind: 'sick', type: 'Sick leave', detail: 'Wed, 7 Oct · 1 day · doctor’s note', status: 'approved' },
      { kind: 'leave', type: 'Annual leave', detail: '19–23 Oct · 5 days', status: 'declined' },
      { kind: 'overtime', type: 'Overtime', detail: 'Wed, 30 Sep · 17:00–19:00 · 2h', status: 'approved' }
    ];
    var well = { leave: ['#e5edfc', '#2858b8'], sick: ['#e5edfc', '#2858b8'], overtime: ['#e6f4f1', '#0d6e63'], correction: ['#e6f4f1', '#0d6e63'] };
    var badge = { pending: ['#e8edeb', '#111816', 'Pending'], approved: ['#e3f4e9', '#1c7a43', 'Approved'], declined: ['#fbe6e4', '#b3261e', 'Declined'] };
    var tab = this.state.tab;
    var list = all.filter(function (r) { return tab === 'all' || r.kind === tab; });
    var items = list.map(function (r, i) {
      var w = well[r.kind], b = badge[r.status];
      return {
        type: r.type, detail: r.detail, status: b[2],
        href: r.status === 'declined' ? 'RequestDetailDeclined.html' : { leave: 'RequestDetail.html', sick: 'RequestDetailSick.html', overtime: 'RequestDetailOvertime.html', correction: 'RequestDetailCorrection.html' }[r.kind],
        isLeave: r.kind === 'leave', isSick: r.kind === 'sick', isOvertime: r.kind === 'overtime', isCorrection: r.kind === 'correction',
        isPending: r.status === 'pending', isApproved: r.status === 'approved', isDeclined: r.status === 'declined',
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0; text-decoration: none; color: #111816;' + (i < list.length - 1 ? ' border-bottom: 1px solid #d3dcd9;' : ''),
        wellStyle: 'width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: ' + w[0] + '; color: ' + w[1] + ';',
        badgeStyle: 'flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; background: ' + b[0] + '; color: ' + b[1] + ';'
      };
    });
    var defs = [['all', 'All'], ['leave', 'Leave'], ['sick', 'Sick'], ['overtime', 'Overtime'], ['correction', 'Correction']];
    var tabs = defs.map(function (d) {
      var on = tab === d[0];
      return {
        label: d[1], selected: on ? 'true' : 'false',
        pick: function () { self.setState({ tab: d[0] }); },
        style: 'flex: 0 0 auto; height: 40px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'border: 0; background: #0d6e63; color: #ffffff;' : 'border: 1px solid #d3dcd9; background: #ffffff; color: #111816;')
      };
    });
    return { tabs: tabs, items: items };
  }
}
</script>
</body>
</html>
