# Local dev: infra only. Apps run on the host with `bun run dev` (DEPLOYMENT.md §4).
name: clockin-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: clockin, POSTGRES_PASSWORD: clockin, POSTGRES_DB: clockin }
    ports: ['5432:5432']
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U clockin'], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  # S3-compatible storage. MinIO CE was archived upstream (Apr 2026) and its images pulled,
  # so RustFS stands in: same S3 API and ports, app only sees S3_* env vars.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: clockin
      RUSTFS_SECRET_KEY: clockin-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: [s3-data:/data]
  s3-init:
    image: amazon/aws-cli:2.37.12
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: clockin
      AWS_SECRET_ACCESS_KEY: clockin-secret
      AWS_DEFAULT_REGION: us-east-1
    # Bucket stays private (no policy): the API hands out presigned URLs only.
    entrypoint: >
      sh -c "until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket clockin 2>/dev/null
             || aws --endpoint-url http://rustfs:9000 s3 mb s3://clockin; do sleep 1; done"
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['1025:1025', '8025:8025']
volumes: { pg-data: {}, s3-data: {} }
